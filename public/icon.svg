<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 天剑音乐 应用图标：深色圆角底 + Apple Music 粉红音符，与 App 内主色一致 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c77"/>
      <stop offset="1" stop-color="#fa2d48"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 音符主体 -->
  <g fill="url(#acc)">
    <circle cx="186" cy="356" r="62"/>
    <circle cx="368" cy="306" r="62"/>
    <rect x="226" y="140" width="32" height="228" rx="16"/>
    <rect x="408" y="108" width="32" height="210" rx="16"/>
  </g>
  <!-- 连接两个音符头的横梁 -->
  <path d="M242 176 L424 132 L424 206 L242 250 Z" fill="url(#acc)"/>
</svg>
