# OpMusic 部署配置（直接拉取已发布镜像，无需本地构建）
# 关键：把宿主机 ./data 挂到容器 /data，歌单/收藏/账号/设置才会真正持久化。
# 没挂这个卷（或用了匿名卷重建容器）→ /data/store.json 就没了，这就是「歌单不持久化」的根因。
services:
  opmusic:
    image: tianjian518/opmusic:latest
    container_name: opmusic
    pull_policy: always          # 每次启动拉最新镜像，等同于 docker compose pull
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data           # 显式声明数据目录，与服务端存储路径一致
    volumes:
      # 左边可改成绝对路径，如 /opt/opmusic-data:/data
      - ./data:/data
